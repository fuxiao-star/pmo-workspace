<aside><div class="brand"><b>P</b> PMO <small>/ workspace</small></div><div class="nav-label">项目管理工作台</div><nav><button data-view="overview">▦　项目总览</button><button data-view="reports">▤　周报档案</button><button id="openForm">↗　周报填报</button><button data-view="settings">⚙　接收与小组设置</button></nav><div class="side-note"><span class="tag">团队共享 · SQLite</span><strong>项目有进展，<br>管理有依据。</strong>七组服务项目与 PMO 自身项目分开查看。</div></aside>
<main><header><span id="breadcrumb">工作区 / 项目总览</span><div class="actions"><button id="demoBtn">查看完整示例</button><button id="refresh">↻ 刷新数据</button></div></header><div class="page"><p id="notice" class="notice" role="status"></p><div id="demoBanner"></div><div id="content"></div><footer id="footnote"></footer></div></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const teamMode=__TEAM_MODE__,apiPrefix='__API_PREFIX__';
const token='__ADMIN_TOKEN__',$=s=>document.querySelector(s),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={groups:[],reports:[],total:0,connection:{}},view='overview',demo=false,selection=null,detailTab='summary',reportId=null,query='',filter='all',toastTimer,categories={};try{categories=JSON.parse(localStorage.getItem('pmo-project-categories')||'{}')}catch{}
const phases={Idee:'创意',Planung:'规划',Konzept:'方案',Prototyp:'原型',Abschluss:'完成'},milestones={Offen:'待处理','In Bearbeitung':'进行中',Erreicht:'已完成',Verschoben:'已延期'},statuses={green:'按计划进行',yellow:'需要关注',red:'需要支持'};
function val(v,blank='未填写'){return v!==null&&v!==undefined&&String(v).trim()!==''?E(v):'<span class="missing">'+blank+'</span>'}
function status(v){return '<span class="tag '+(statuses[v]?v:'gray')+'">'+(statuses[v]?'● '+statuses[v]:'尚未填报')+'</span>'}
function date(v,full=false){if(!v)return '尚未提交';const d=new Date(v);return isNaN(d)?E(v):d.toLocaleString('zh-CN',full?{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}:{year:'numeric',month:'2-digit',day:'2-digit'})}
function amount(v,unit='€'){return v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2})+' '+unit:'<span class="missing">未填写</span>'}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function late(d){return !!d.deadline&&d.deadline<today()&&d.milestoneStatus!=='Erreicht'}
function stale(r){return r&&Date.now()-new Date(r.created_at).getTime()>604800000}
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
async function api(path,body){const r=await fetch(apiPrefix+path,{method:body?'POST':'GET',headers:{'X-PMO-Admin':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok){if(teamMode&&r.status===401)location.href='/team';throw Error(d.error||'请求失败')}return d}
function sample(){const now=Date.now(),groups=Array.from({length:8},(_,i)=>({id:9001+i,name:i===7?'第 8 组 · PMO':'第 '+String(i+1).padStart(2,'0')+' 组',active:1})),titles=['校园活动平台','智能学习助手','可持续校园计划','实验室预约系统','学生交流社区','校园资源地图','课程反馈平台','PMO 管理系统'],reports=[];groups.forEach((g,i)=>{for(let w=0;w<2;w++){const created=new Date(now-(w*7+i%3)*86400000),deadline=new Date(now+(i===2?-2:7)*86400000);reports.push({id:'DEMO-'+g.id+'-'+w,registered_group:g.name,created_at:created.toISOString(),data:{group:g.name,project:titles[i],contact:['Alex','Sam','Lea','Max'][i%4],email:'team'+(i+1)+'@example.com',date:created.toISOString().slice(0,10),period:w?'上周 · 示例':'本周 · 示例',phase:w?'Planung':i===2?'Konzept':'Prototyp',status:i===2?'red':i===4?'yellow':'green',results:w?'完成项目范围梳理，明确初步需求与任务分工。':'完成需求评审和第一轮原型测试。\n整理用户反馈，修订核心流程。',milestone:'完成原型验证',deadline:deadline.toISOString().slice(0,10),milestoneStatus:i===2?'Verschoben':'In Bearbeitung',budget:'1000',cost:String(250+i*80-w*100),plannedHours:'120',hours:String(32+i*5-w*12),deviations:i===2?'测试资源未及时到位，里程碑预计延后两天。':'目前未发现明显工期或费用偏差。',risks:i===2?'测试设备尚未到位，影响原型验收。':i===4?'部分用户需求仍待确认。':'',support:i===2?'请 PMO 协调测试资源和预约时间。':'',next:'完成测试反馈整理 · Alex · 下周三\n更新需求文档 · Sam · 下周五',notes:'以上为界面演示数据，不代表真实项目进展。'}})}});return {groups,reports,total:reports.length,connection:state.connection,database:state.database}}
function source(){return demo?sample():state}
function projects(){const s=source();return s.groups.map(g=>{const history=s.reports.filter(r=>r.registered_group===g.name).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return {group:g,history,latest:history[0]||null,kind:demo?(g.id===9008?'pmo':'service'):(g.project_kind||'service')}})}
function stat(label,value,desc){return '<div class="stat"><span>'+label+'</span><strong>'+value+'</strong><small>'+desc+'</small></div>'}
function title(eye,heading,desc,actions=''){return '<div class="intro"><div><p class="eyebrow">'+eye+'</p><h1>'+heading+'</h1><p>'+desc+'</p></div><div class="actions no-print">'+actions+'</div></div>'}
function field(k,v){return '<div class="field"><small>'+k+'</small><div>'+val(v)+'</div></div>'}
function block(k,v,blank='本次未填写'){return '<div class="block"><h3>'+k+'</h3><p>'+val(v,blank)+'</p></div>'}
function budget(d){if(!d.budget||d.cost===''||d.cost===undefined||Number(d.budget)<=0)return '<div class="note">'+(d.budget==='0'?'总预算为 0，无法计算使用率。':'预算或费用未填写，暂无使用率。')+'</div>';const p=Number(d.cost)/Number(d.budget)*100;return '<p class="big" style="color:'+(p>100?'#a84d43':'var(--green)')+'">'+p.toLocaleString('zh-CN',{maximumFractionDigits:1})+'%</p><div class="track"><i style="width:'+Math.max(0,Math.min(p,100))+'%"></i></div><small class="muted">已用 '+amount(d.cost)+' / 总预算 '+amount(d.budget)+(p>100?' · 已超预算':'')+'</small>'}
function table(list){const found=list.filter(p=>{const d=p.latest?.data||{};return (!query||(p.group.name+' '+d.project+' '+d.contact).toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||(filter==='none'?!p.latest:d.status===filter))});if(!found.length)return '<div class="empty"><strong>'+(list.length?'没有符合条件的项目':'还没有登记项目小组')+'</strong>'+(list.length?'请调整搜索或筛选条件。':'先到设置页创建小组，或点击右上角“查看完整示例”预览。')+'</div>';return '<div class="scroll"><table><thead><tr><th>项目 / 小组</th><th>整体状态</th><th>阶段</th><th>最新提交</th><th>下一里程碑</th><th>投入与费用</th><th></th></tr></thead><tbody>'+found.map(p=>{const r=p.latest,d=r?.data||{};return '<tr><td><strong>'+E(d.project||'项目待填报')+'</strong><small>'+E(p.group.name)+(p.group.active?'':' · 提交码已停用')+'</small></td><td>'+status(d.status)+'</td><td>'+val(phases[d.phase],'待确认')+'</td><td>'+date(r?.created_at)+'<small>'+(stale(r)?'<span style="color:#a27623">超过 7 天 · 待更新</span>':r?'共 '+p.history.length+' 份周报':'等待首次提交')+'</small></td><td>'+val(d.milestone,'暂无里程碑')+'<small>'+E(d.deadline||'日期待填写')+(late(d)?' · <span style="color:#a84d43">已延期</span>':'')+'</small></td><td>'+amount(d.hours,'h')+'<small>已支出 '+amount(d.cost)+'</small></td><td><button class="link" data-project="'+p.group.id+'">查看详情 →</button></td></tr>'}).join('')+'</tbody></table></div>'}
function overview(){const all=projects(),service=all.filter(p=>p.kind==='service'),pmo=all.filter(p=>p.kind==='pmo'),submitted=service.filter(p=>p.latest),delayed=submitted.filter(p=>late(p.latest.data)),issues=submitted.filter(p=>p.latest.data.risks||p.latest.data.support||p.latest.data.status==='red');return title('PORTFOLIO OVERVIEW','每个项目，清晰可见。','汇总各组最新周报，关注进度、投入与需要协调的问题。','<button data-view="reports">查看全部周报 →</button>')+'<div class="stats">'+stat('被服务的项目',service.length,'目标 7 组 · PMO 自身不计入')+stat('已提交周报',submitted.length+' <span style="font-size:15px;color:#9aa58f">/ '+service.length+'</span>','按各组最新一次提交统计')+stat('里程碑延期',delayed.length,'已过计划日期且未标记完成')+stat('有风险 / 需支持',issues.length,'按最新报告内容与状态识别')+'</div><div class="panel"><div class="panel-head"><h2>服务项目总览</h2><small>仅统计每组最新报告</small></div><div class="toolbar no-print"><input id="search" type="search" placeholder="搜索项目、小组或联系人" value="'+E(query)+'"><select id="statusFilter" aria-label="筛选项目状态"><option value="all">全部状态</option><option value="green">按计划进行</option><option value="yellow">需要关注</option><option value="red">需要支持</option><option value="none">尚未填报</option></select></div><div id="projectRows">'+table(service)+'</div><div class="note">更新时间超过 7 天会提示“待更新”。风险与状态为小组自报内容，接收成功不代表已完成 PMO 审核。</div></div><div class="panel"><div class="panel-head"><h2>PMO 自身项目 <span class="tag">单独统计</span></h2><small>第八组的建设与管理工作</small></div>'+(pmo.length?pmo.map(p=>'<div class="pmo-row"><div><strong>'+E(p.latest?.data.project||p.group.name)+'</strong><p>'+E(p.group.name)+' · '+date(p.latest?.created_at)+'</p></div><div class="actions">'+status(p.latest?.data.status)+'<button data-project="'+p.group.id+'">项目详情 →</button></div></div>').join(''):'<div class="note">尚未指定 PMO 自身项目。请到“接收与小组设置”，将第八组分类改为“PMO 自身”。</div>')+'</div>'}
function detail(){const p=projects().find(p=>String(p.group.id)===String(selection));if(!p)return '<div class="empty">项目不存在，请返回项目总览。</div>';const r=p.latest,d=r?.data||{};let h=title(p.kind==='pmo'?'PMO INTERNAL PROJECT':'PROJECT DETAIL',E(d.project||p.group.name),'项目详情 · '+E(p.group.name)+' · '+(p.kind==='pmo'?'PMO 自身项目':'服务项目'),'<button data-view="overview">← 返回总览</button>'+(r?'<button class="primary" data-report="'+E(r.id)+'">查看完整周报</button>':''));h+='<div class="actions">'+status(d.status)+'<small class="muted">最近更新：'+date(r?.created_at,true)+'</small></div><div class="tabs no-print">'+[['summary','项目概况'],['history','周报历史 · '+p.history.length],['milestone','里程碑与成熟度']].map(([id,label])=>'<button data-tab="'+id+'" class="'+(detailTab===id?'active':'')+'">'+label+'</button>').join('')+'</div>';if(!r)return h+'<div class="panel empty"><strong>这个项目尚未提交周报</strong>首次提交后，会展示联系人、成果、工时、里程碑和历史记录。</div>';
if(detailTab==='history')return h+'<div class="panel"><h2>项目的每一次进展</h2><p class="muted">按接收时间排列，保留每次提交记录。</p>'+p.history.map((r,i)=>'<div class="timeline"><h3>'+E(r.data.period||'周期未填写')+(i===0?' <span class="tag">最新</span>':'')+'</h3><div class="actions">'+status(r.data.status)+'<small class="muted">'+date(r.created_at,true)+'</small></div><p>'+E((r.data.results||'本次未填写成果').slice(0,150))+'</p><button class="link" data-report="'+E(r.id)+'">查看这份完整周报 →</button></div>').join('')+'</div>';
if(detailTab==='milestone')return h+'<div class="grid equal"><div class="panel"><h2>当前里程碑</h2><p>'+val(d.milestone,'尚未填写里程碑')+'</p><div class="actions"><span>计划日期：'+val(d.deadline)+'</span><span class="tag '+(late(d)?'red':'gray')+'">'+val(milestones[d.milestoneStatus])+'</span></div><div style="margin-top:25px">'+block('偏差与说明',d.deviations)+'</div></div><div class="panel"><h2>阶段与成熟度证据</h2><p class="muted">当前自报阶段：'+val(phases[d.phase])+'</p><div class="steps">'+Object.keys(phases).map((v,i)=>'<div class="step '+(i<=Object.keys(phases).indexOf(d.phase)?'done':'')+'"><i></i>'+phases[v]+'</div>').join('')+'</div><div class="note">阶段表示开发成熟度，不代表已完成工作量，也不是经过审核的成熟度分数。</div><h3>证据与审核</h3><p class="missing">当前版本尚未接入附件上传或证据审核。没有证据时，不会自动判定里程碑验收或成熟度提升。</p></div></div><div class="panel"><h2>里程碑提交记录</h2><div class="scroll"><table><thead><tr><th>报告周期</th><th>里程碑</th><th>计划日期</th><th>小组自报状态</th></tr></thead><tbody>'+p.history.map(r=>'<tr><td>'+val(r.data.period)+'</td><td>'+val(r.data.milestone)+'</td><td>'+val(r.data.deadline)+'</td><td>'+val(milestones[r.data.milestoneStatus])+'</td></tr>').join('')+'</tbody></table></div></div>';
return h+'<div class="stats">'+stat('当前阶段',val(phases[d.phase]),'小组自报 · 尚未经审核')+stat('累计投入',amount(d.hours,'h'),'计划工时 '+amount(d.plannedHours,'h'))+stat('累计费用',amount(d.cost),'计划预算 '+amount(d.budget))+stat('已收到周报',p.history.length,'每次提交独立保留')+'</div><div class="grid"><div><div class="panel">'+block('本周成果',d.results)+block('下周计划与负责人',d.next)+'</div><div class="panel">'+block('风险与阻碍',d.risks,'本次未填写风险信息，不能据此判断无风险')+block('应对措施与所需支持',d.support)+'</div></div><div><div class="panel"><h2>项目联系人</h2><div class="info-grid">'+field('联系人',d.contact)+field('电子邮箱',d.email)+field('填报小组',d.group)+field('报告周期',d.period)+'</div></div><div class="panel"><h2>预算使用情况</h2>'+budget(d)+'</div><div class="panel"><h2>下一个里程碑</h2><p>'+val(d.milestone)+'</p><div class="actions">'+val(d.deadline)+'<span class="tag gray">'+val(milestones[d.milestoneStatus])+'</span></div></div></div></div>'}
function archive(){const s=source();return title('REPORT ARCHIVE','每一份周报，都有记录。','点击查看完整报告，也可以打印或保存为 PDF。')+'<div class="panel"><div class="panel-head"><h2>周报档案</h2><small>共 '+s.total+' 份 · 最多显示最近 500 份</small></div>'+(s.reports.length?'<div class="scroll"><table><thead><tr><th>项目 / 小组</th><th>报告周期</th><th>整体状态</th><th>接收时间</th><th></th></tr></thead><tbody>'+[...s.reports].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(r=>'<tr><td><strong>'+val(r.data.project)+'</strong><small>'+E(r.registered_group)+'</small></td><td>'+val(r.data.period)+'</td><td>'+status(r.data.status)+'</td><td>'+date(r.created_at,true)+'</td><td><button class="link" data-report="'+E(r.id)+'">查看报告 →</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><strong>等待第一份周报</strong>各组提交成功后，报告会自动进入档案。</div>')+'</div>'}
function report(){const r=source().reports.find(r=>r.id===reportId);if(!r)return '<div class="empty">该报告不在当前加载的最近 500 份记录内。</div>';const d=r.data;return '<div class="report-sheet">'+title('WEEKLY PROJECT REPORT',E(d.project||'项目周报'),E(r.registered_group)+' · '+E(d.period||'周期未填写'),'<button data-view="reports">← 周报档案</button><button id="printReport" class="primary">打印 / 保存 PDF</button>')+'<div class="panel"><div class="panel-head"><h2>01　基本信息</h2>'+status(d.status)+'</div><div class="info-grid">'+field('项目名称',d.project)+field('登记小组',r.registered_group)+field('联系人',d.contact)+field('电子邮箱',d.email)+field('报告日期',d.date)+field('报告周期',d.period)+field('当前项目阶段',phases[d.phase])+field('接收时间',date(r.created_at,true))+'</div></div><div class="panel"><h2>02　成果与下一步计划</h2><div style="margin-top:22px">'+block('本周成果',d.results)+block('下周计划与负责人',d.next)+'</div></div><div class="panel"><h2>03　里程碑</h2><div class="info-grid">'+field('下一个里程碑',d.milestone)+field('小组自报状态',milestones[d.milestoneStatus])+field('计划完成日期',d.deadline)+field('日期检查',d.deadline?(late(d)?'已过计划日期，且尚未标记完成':d.milestoneStatus==='Erreicht'?'小组标记为已完成，验收仍需证据':'尚未超过计划日期'):'未填写日期，无法判断延期')+'</div></div><div class="panel"><h2>04　工时与预算</h2><div class="info-grid">'+field('计划总预算',d.budget!==''&&d.budget!==undefined?Number(d.budget).toLocaleString()+' €':'')+field('截至目前费用',d.cost!==''&&d.cost!==undefined?Number(d.cost).toLocaleString()+' €':'')+field('计划总工时',d.plannedHours!==''&&d.plannedHours!==undefined?d.plannedHours+' h':'')+field('截至目前总工时',d.hours!==''&&d.hours!==undefined?d.hours+' h':'')+'</div>'+budget(d)+'<div style="margin-top:22px">'+block('工期与费用偏差说明',d.deviations)+'</div></div><div class="panel"><h2>05　风险与支持</h2><div style="margin-top:22px">'+block('风险与阻碍',d.risks,'本次未填写风险信息')+block('应对措施与所需支持',d.support)+block('其他备注',d.notes)+'</div><div class="note">整体状态与里程碑状态均由项目组填报，接收成功不等于已完成 PMO 审核或验收。</div><div class="receipt">接收回执：'+E(r.id)+'<br>接收时间：'+date(r.created_at,true)+(demo?'<br>演示数据 · 未写入数据库':'')+'</div></div></div>'}
function settings(){const s=source();return title('WORKSPACE SETTINGS','让每个小组，顺利连接。','管理填报入口、小组提交码和项目分类。')+'<div class="grid equal"><div class="panel"><h2>填报入口</h2><div class="note">将填报网址与各组自己的提交码发给对应小组。管理页仅供本机使用。</div><p id="connectionLink"></p><p class="muted" style="font-size:12px">临时隧道重启后地址会变化。电脑、网络和接收服务需要保持运行。</p><button id="copyLink">复制填报网址</button></div><div class="panel"><h2>本机数据</h2><p class="muted">共收到 <strong>'+s.total+'</strong> 份周报</p><p class="mono">'+E(s.database||'本机 SQLite 数据库')+'</p><div class="note">备份前请先关闭接收程序，再复制完整的 data 文件夹。</div></div></div><div class="panel"><h2>登记小组与提交码</h2><p class="muted" style="font-size:12px">每组使用独立提交码，可随时停用或重新启用。重新启用沿用原码；重新生成会让旧码失效，新码仅显示一次。所有操作均保留已有周报。</p><form id="groupForm" class="settings-form"><input id="groupName" required maxlength="100" placeholder="例如：第 01 组" '+(demo?'disabled':'')+'><button class="primary" '+(demo?'disabled':'')+'>创建小组与提交码</button></form><div id="code"></div><div class="scroll"><table><thead><tr><th>登记小组</th><th>接收权限</th><th>项目分类</th><th>操作</th></tr></thead><tbody>'+s.groups.map(g=>{const kind=demo?(g.id===9008?'pmo':'service'):(g.project_kind||'service');return '<tr><td>'+E(g.name)+'</td><td><span class="tag '+(g.active?'green':'gray')+'">'+(g.active?'允许提交':'已停用')+'</span></td><td><select class="classification" data-category="'+g.id+'" '+(demo?'disabled':'')+'><option value="service" '+(kind==='service'?'selected':'')+'>服务项目</option><option value="pmo" '+(kind==='pmo'?'selected':'')+'>PMO 自身</option></select></td><td>'+(g.active?'<button data-disable="'+g.id+'" '+(demo?'disabled':'')+'>停用</button>':'<button data-enable="'+g.id+'" '+(demo?'disabled':'')+'>重新启用</button>')+' <button data-reset-code="'+g.id+'" '+(demo?'disabled':'')+'>重新生成</button>'+'</td></tr>'}).join('')+'</tbody></table></div><div class="note">项目分类保存在共享数据库，团队成员看到同一份分类。将第八组设为“PMO 自身”，即可单独统计。</div></div>'}
function render(){const labels={overview:'项目总览',reports:'周报档案',settings:'接收与小组设置',detail:'项目详情',report:'周报详情'};$('#breadcrumb').textContent='工作区 / '+labels[view];document.querySelectorAll('nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#demoBtn').textContent=demo?'返回真实数据':'查看完整示例';$('#demoBanner').innerHTML=demo?'<div class="banner"><strong>演示模式</strong> · 展示七组服务项目和第八组 PMO 自身项目。示例仅用于预览，不写入数据库。</div>':'';$('#content').innerHTML=({overview,reports:archive,settings,detail,report}[view]||overview)();$('#footnote').textContent=demo?'演示内容 · 仅用于展示完整项目模板':'共享数据 · 当前加载最近 500 份报告 · 项目分类保存在数据库';if($('#statusFilter'))$('#statusFilter').value=filter;if(view==='settings'){$('#content').insertAdjacentHTML('beforeend',teamPanel());const url=state.connection?.url,h=$('#connectionLink');if(url&&/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)){const a=document.createElement('a');a.href=url;a.textContent=url;a.target='_blank';a.rel='noreferrer';h.replaceChildren(a)}else h.textContent='外网暂无可用入口，本机可访问 http://127.0.0.1:8765'}}
function navigate(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
async function refresh(){const b=$('#refresh');b.disabled=true;try{state=await api('/api/overview');$('#notice').textContent='';render()}catch(e){$('#notice').textContent='无法刷新数据：'+e.message+'。请确认本机接收服务正在运行。'}finally{b.disabled=false}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)return navigate(b.dataset.view);if(b.dataset.project){selection=b.dataset.project;detailTab='summary';return navigate('detail')}if(b.dataset.report){reportId=b.dataset.report;return navigate('report')}if(b.dataset.tab){detailTab=b.dataset.tab;return render()}if(b.id==='demoBtn'){demo=!demo;query='';filter='all';return navigate('overview')}if(b.id==='refresh')return refresh();if(b.id==='openForm')return window.open(state.connection?.url||'http://127.0.0.1:8765','_blank','noopener');if(b.id==='printReport')return window.print();if(b.id==='copyLink'){try{await navigator.clipboard.writeText(state.connection?.url||'http://127.0.0.1:8765');toast('填报网址已复制')}catch{toast('请选中网址并复制')}return}if(b.dataset.disable&&!demo){const g=state.groups.find(g=>String(g.id)===b.dataset.disable);if(g&&confirm('停用 '+g.name+' 的提交码？已有周报将继续保留。')){try{await api('/api/groups/disable',{id:g.id});await refresh();toast('提交码已停用')}catch(e){toast('操作失败：'+e.message)}}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#projectRows').innerHTML=table(projects().filter(p=>p.kind==='service'))}});
document.addEventListener('change',async e=>{if(e.target.id==='statusFilter'){filter=e.target.value;$('#projectRows').innerHTML=table(projects().filter(p=>p.kind==='service'))}if(e.target.dataset.category&&!demo){try{await api('/api/groups/category',{id:Number(e.target.dataset.category),kind:e.target.value});await refresh();toast('项目分类已保存，团队成员可看到相同分类')}catch(error){toast('保存失败：'+error.message)}}});
document.addEventListener('submit',async e=>{if(e.target.id!=='groupForm')return;e.preventDefault();if(demo)return;const name=$('#groupName').value.trim();if(!name)return;try{const d=await api('/api/groups',{name});await refresh();$('#code').className='code-box';$('#code').textContent=d.name+' 的提交码（仅显示一次）：'+d.code;toast('小组已创建，请保存提交码')}catch(e){toast(e.message==='duplicate_group'?'小组名称已存在，请使用不同名称。':'创建失败：'+e.message)}});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||demo||(!b.dataset.enable&&!b.dataset.resetCode))return;
 const id=b.dataset.enable||b.dataset.resetCode,g=state.groups.find(g=>String(g.id)===id);if(!g)return;
 const reset=!!b.dataset.resetCode;
 const question=reset?'重新生成 '+g.name+' 的提交码？旧码将立即失效，新码仅显示一次。已有周报会保留，当前启用/停用状态保持不变。':'重新启用 '+g.name+' 的提交码？原提交码将恢复使用，已有周报不变。';
 if(!confirm(question))return;b.disabled=true;
 try{const d=await api('/api/groups/'+(reset?'reset-code':'enable'),{id:g.id});await refresh();
 if(reset){const box=$('#code');box.className='code-box';box.textContent=d.name+' 的新提交码（仅显示一次）：'+d.code+'。'+(d.active?'现已可用。':'当前仍处于停用状态，点击重新启用后可用。');box.scrollIntoView({behavior:'smooth',block:'center'});toast('新提交码已生成，旧码已失效，请保存新码')}
 else toast('提交码已重新启用，原码可继续使用');
 }catch(e){b.disabled=false;toast('操作失败：'+e.message)}
});

function teamPanel(){
 const url=state.connection?.url,link=url?url+'/team':'接收服务启动外网连接后可用';
 const members=state.teamMembers||[];
 return '<div class="panel"><h2>团队共用数据库入口</h2><p class="mono">'+E(link)+'</p><div class="note">你和同学登录此入口后，共用这台电脑上的周报、项目分类和提交码状态。只有团队访问码可以登录，普通小组提交码无权查看。电脑与接收服务需要在线。</div>'+(teamMode?'<button id="teamLogout">退出团队会话</button>':'<p class="muted">为同学创建独立团队访问码，私下发送。团队访问码可查看报告并管理项目组提交码，请仅发给项目开发者。</p><form id="memberForm" class="settings-form"><input id="memberName" required maxlength="100" placeholder="例如：开发同学"><button class="primary" '+(demo?'disabled':'')+'>创建团队访问码</button></form><div id="memberCode"></div><div class="scroll"><table><thead><tr><th>团队成员</th><th>访问状态</th><th>操作</th></tr></thead><tbody>'+members.map(m=>'<tr><td>'+E(m.name)+'</td><td>'+ (m.active?'已启用':'已停用')+'</td><td><button data-team-action="'+(m.active?'disable':'enable')+'" data-member="'+m.id+'">'+(m.active?'停用':'重新启用')+'</button> <button data-team-action="reset-code" data-member="'+m.id+'">重新生成访问码</button></td></tr>').join('')+'</tbody></table></div>')+'</div>';
}
document.addEventListener('submit',async e=>{if(e.target.id!=='memberForm')return;e.preventDefault();if(demo||teamMode)return;try{const d=await api('/api/team/members',{name:$('#memberName').value.trim()});await refresh();$('#memberCode').className='code-box';$('#memberCode').textContent=d.name+' 的团队访问码（只显示一次）：'+d.code;toast('团队访问码已创建，请私下保存并发送')}catch(error){toast('创建失败：'+error.message)}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='teamLogout'){await api('/logout',{});location.href='/team';return}if(!b.dataset.teamAction||demo||teamMode)return;const m=(state.teamMembers||[]).find(m=>String(m.id)===b.dataset.member);if(!m)return;const action=b.dataset.teamAction;if(!confirm((action==='reset-code'?'重新生成访问码并注销其现有会话':action==='disable'?'停用访问并注销其现有会话':'重新启用访问')+'：'+m.name+'？'))return;try{const d=await api('/api/team/members/'+action,{id:m.id});await refresh();if(d.code){$('#memberCode').className='code-box';$('#memberCode').textContent=d.name+' 的新团队访问码（只显示一次）：'+d.code}else toast('团队访问状态已更新')}catch(error){toast('操作失败：'+error.message)}});

refresh();
</script></body></html>
