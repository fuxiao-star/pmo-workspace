<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMO · 团队登录</title><style>body{font:14px/1.8 system-ui,sans-serif;background:#f5f7f2;color:#254032;margin:0;min-height:100vh;display:grid;place-items:center}main{background:white;border:1px solid #dfe8d8;border-radius:16px;padding:36px;width:min(430px,85vw)}h1{font-size:25px}p,small{color:#7d8b73}label{display:block;margin:25px 0 8px}input,button{font:inherit;padding:12px;border-radius:7px;border:1px solid #d4e0cc;box-sizing:border-box;width:100%}button{margin-top:18px;background:#245d48;color:white;cursor:pointer}#message{color:#a84d43;font-size:12px}button:disabled{opacity:.6}</style></head><body><main><small>PMO / SHARED WORKSPACE</small><h1>一起管理，同一份数据。</h1><p>登录后可查看共享周报、项目状态和提交码设置。团队访问码由本机负责人分配。</p><form id="login"><label for="code">团队访问码</label><input id="code" type="password" autocomplete="off" required maxlength="100"><button id="button">登录团队工作台 →</button></form><p id="message" role="status"></p><small>访问码不同于项目组提交码。请私下保管；登录会话有效期为 8 小时。</small></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#button'),m=document.querySelector('#message');b.disabled=true;m.textContent='';try{const r=await fetch('/team/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#code').value.trim()})});if(r.ok)location.replace('/team');else m.textContent=r.status===429?'尝试次数过多，请在 10 分钟后重试。':'访问码无效或已被停用。'}catch{m.textContent='连接失败，请确认负责人电脑和接收服务在线。'}finally{b.disabled=false}};</script></body></html>
